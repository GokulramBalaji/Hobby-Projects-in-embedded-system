# ==============================================================================
# Mosquitto MQTT Broker Configuration for AMT Control System
# ==============================================================================

# Standard TCP Listener for ESP32 and Backend
listener 1883 0.0.0.0
protocol mqtt

# WebSocket Listener for Browser Direct Connectivity
listener 9001 0.0.0.0
protocol websockets

# Security & Authentication
# Note: For lab/development setup, allow_anonymous is enabled.
# For production, create a password file with: mosquitto_passwd -c password.file amt_user
allow_anonymous true

# Persistence Configuration
persistence true
persistence_location ./mqtt/data/
autosave_interval 1800

# Connection & Quality of Service
max_queued_messages 1000
max_inflight_messages 20
max_packet_size 65536
persistent_client_expiration 1d

# Logging Configuration
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

